# KeyJaya defaults. User changes are stored in the installed configuration.
# Fresh-install template only; upgrades preserve the user's saved settings.
start_with_windows=true
autocorrect_spelling=true
auto_contractions=true
encoding_override=auto
italicize_conversions=true
# Historical internal value "sanskrit" selects ITRANS for Ctrl+backslash.
# Sanskrit and Bengali conversion shortcuts are always available.
script_language=sanskrit
script_precise=false
preserve_verse_markers=false
