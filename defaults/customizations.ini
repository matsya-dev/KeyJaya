# Optional customizations. Save, then choose Reload configuration in the tray.
# Rows below each heading use actual TAB separators. Uncomment examples to use.
# Existing legacy TSV files remain supported and are never rewritten on load.
# Entries here override legacy entries in the same section. Word preferences
# take priority over general aliases. Ordered replacements run last.

[aliases]
# input<TAB>Unicode/IAST output (general aliases, including phrases)
# Bhaktivikasa	Bhakti Vikāsa

[words]
# input<TAB>preferred IAST spelling or !keep
# raja	rājā
# age	!keep

[script-words]
# Roman word<TAB>Devanagari output<TAB>Bengali output
# Leave one output empty to use normal conversion. Common mode only.
# kala	काल	কাল

[script-phrases]
# Roman phrase<TAB>Devanagari phrase<TAB>Bengali phrase
# Same word count in each output; matching never crosses a newline.
# kala samay	काल समय	কাল সময়
# kala rang	काला रंग	কালো রং

[italics]
# plain Roman key<TAB>roman / italic / name
# name stays roman when capitalized. Complete verses remain italic.
# raja	name
# bhakti	italic

[replacements]
# FROM<TAB>TO; applied in listed order after normal conversion
# Matching legacy FROM keys are replaced in their original first position;
# new FROM keys run afterward. Matching is case-sensitive; TO may be empty.
# old-form	new-form
