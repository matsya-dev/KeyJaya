name: Suggest an improvement
description: Describe a writing task KeyJaya could make easier.
title: "[Feature]: "
body:
  - type: textarea
    id: task
    attributes:
      label: What would you like to do?
      description: Include the app, example text, and desired result when relevant.
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: How do you do this now?
      description: Explain what is slow, confusing, or missing.
